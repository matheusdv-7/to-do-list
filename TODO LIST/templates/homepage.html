{% extends "base.html" %}

{% block title %}Escolha uma data{% endblock %}

{% block content %}
<section class="card task-card mx-auto p-4">
    <h1 class="h3 mb-4">Selecione uma data</h1>

    <form action="{{ url_for('tarefas') }}" method="get">
        <label for="date" class="form-label">Data das tarefas</label>
        <input type="date" id="date" name="date" class="form-control mb-3" required>
        <button type="submit" class="btn btn-primary w-100">Ver tarefas</button>
    </form>
</section>
{% endblock %}
